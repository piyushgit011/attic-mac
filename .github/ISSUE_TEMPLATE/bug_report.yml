name: Bug report
description: Something in Attic isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Attic version
      placeholder: "1.1.0"
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro M3"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Please blur file names you'd rather not share.
