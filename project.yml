name: Attic
options:
  bundleIdPrefix: studio.versely
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ZMNA9Z2VN7
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Attic:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.versely.attic
        PRODUCT_NAME: Attic
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Attic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
      configs:
        Release:
          # Notarization rejects the debugger entitlement Xcode injects by default
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
